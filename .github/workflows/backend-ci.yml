name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**' # Τρέχει μόνο αν αλλάξει κάτι στον φάκελο backend
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Τρέχει όλες τις εντολές μέσα στο backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Χρησιμοποιούμε 3.12 για να είμαστε σίγουροι

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests with pytest
      run: |
        pytest tests/ -v