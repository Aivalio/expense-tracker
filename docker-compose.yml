version: '3.8'

services:
  backend:
    build: ./backend
    container_name: expense_tracker_backend
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: always

  frontend:
    build: ./frontend
    container_name: expense_tracker_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always